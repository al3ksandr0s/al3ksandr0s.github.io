<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosa sto ascoltando</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Stile del Widget Spotify */
        .spotify-card {
            background: #181818;
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
            border: 1px solid #282828;
        }

        .spotify-card img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #282828;
        }

        .spotify-info {
            overflow: hidden;
            flex-grow: 1;
        }

        .spotify-status {
            font-size: 11px;
            color: #1db954;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .spotify-track {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .spotify-artist {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- Widget HTML -->
    <div class="spotify-card">
        <img id="track-image" src="" alt="Copertina Album">
        <div class="spotify-info">
            <div class="spotify-status" id="live-tag">Caricamento...</div>
            <div class="spotify-track" id="track-name">In attesa dei dati</div>
            <div class="spotify-artist" id="artist-name">Last.fm</div>
        </div>
    </div>

    <!-- Script refresh data-->
    <script>
        const lfmUser = "peyroc";
        const lfmApiKey = "9da9def7ce67a5252ac34cb518f86a85";

        async function updateWidget() {
            try {
                const response = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${lfmUser}&api_key=${lfmApiKey}&format=json&limit=1`);
                const data = await response.json();
                
                if (data && data.recenttracks && data.recenttracks.track.length > 0) {
                    const track = data.recenttracks.track[0];

                    const trackName = track.name;
                    const artistName = track.artist["#text"];
                    const imageUrl = track.image && track.image[2]['#text'] 
                        ? track.image[2]['#text'] 
                        : 'https://via.placeholder.com/60?text=🎵';

                    const isPlaying = track["@attr"] && track["@attr"].nowplaying === "true";
                    document.getElementById("track-name").innerText = trackName;
                    document.getElementById("artist-name").innerText = artistName;
                    document.getElementById("track-image").src = imageUrl;
                    
                    const statusEl = document.getElementById("live-tag");
                    if (isPlaying) {
                        statusEl.innerHTML = "🟢 In ascolto ora";
                        statusEl.style.color = "#1db954";
                    } else {
                        statusEl.innerHTML = "⏳ Ultimo ascolto";
                        statusEl.style.color = "#b3b3b3";
                    }
                }
            } catch (error) {
                console.error("Errore nel recupero dati da Last.fm:", error);
                document.getElementById("live-tag").innerText = "Errore di connessione";
            }
        }

        // Carica subito e aggiorna ogni 15 secondi
        updateWidget();
        setInterval(updateWidget, 15000);
    </script>

</body>
</html>
